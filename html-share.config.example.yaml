ownerEmail: owner@example.com

cloudflare:
  accountId: "00000000000000000000000000000000"
  consoleDomain: html-share-console.example.com
  contentDomain: html-share-content.example.com
  consoleBucket: html-share-console
  contentBucket: html-share-content
  publicKeyPath: .html-share/keys/public.pem
  privateKeyPath: .html-share/keys/private.pem

content:
  roots:
    - examples
  pages:
    - path: examples/demo-report.html
      title: デモレポート
      slug: demo-report
      repository: examples
      stream: demo
      streamLabel: デモ
  ownerLinkDays: 30
  maximumShareDays: 30
  maximumAssetBytes: 10485760
  # 社内限定URLを使う場合だけ、組織の出口IPをCIDRで指定します。
  allowedInternalCidrs:
    - 203.0.113.0/24

  # ── リンクプレビュー（OGP） ───────────────────────────────────────
  # 共有したURLをSlackやTeamsへ貼ったときに出るカードの中身です。
  # siteName はカードに出るアプリ名。省略すると「#HTML共有くん」になります。
  siteName: "#HTML共有くん"
  # ogImageUrl はカードに出す画像の絶対URL（https）。省略すると画像なしのカードになります。
  # 配信面は署名付きURLなのでクローラーが画像を取れません。画像を出すなら、
  # 認証なしで取れる場所（GitHub Pages、S3の公開バケットなど）へ1枚置いてURLを書きます。
  # Teams は og:image が無いとカードを出しません（Slack と X はテキストだけでも出ます）。
  # 置いた画像は、URLを直接叩いて 200 と Content-Type: image/* が返ることを確かめてください。
  # 落ちていても表に出ず、カードが静かに縮むだけです。
  # ogImageUrl: https://example.com/og-card.png
  # ogCardType はカードの大きさ。省略すると summary（各媒体でいちばん小さいカード）です。
  # summary_large_image は 1200x630 前後の横長画像を前提にした見せ方で、
  # 正方形やロゴを渡すと引き伸ばされます。
  # ogCardType: summary_large_image
